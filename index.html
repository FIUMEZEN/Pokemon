<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokémon — al banco</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f26; --muted:#6b7280; --line:#e5e7eb; --acc:#2563eb; --good:#15803d; --bad:#b91c1c; --warn:#b45309; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12141a; --card:#1b1e27; --text:#e8eaef; --muted:#9aa1b0; --line:#2b2f3b; --acc:#6b9bff; --good:#4ade80; --bad:#f87171; --warn:#fbbf24; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:10px 14px; background:var(--card); border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; position:sticky; top:0; z-index:9; }
  h1 { font-size:16px; margin:0; white-space:nowrap; }
  nav { display:flex; gap:4px; margin-left:auto; }
  nav button { border:0; background:none; padding:9px 16px; border-radius:8px; cursor:pointer; color:var(--muted); font:inherit; }
  nav button.on { background:var(--acc); color:#fff; }
  main { max-width:820px; margin:0 auto; padding:12px 14px 40px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  input { font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:9px; background:var(--bg); color:var(--text); }
  button.b { font:inherit; padding:10px 14px; border:1px solid var(--line); border-radius:9px; background:var(--card); color:var(--text); cursor:pointer; }
  button.b.p { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.b.big { font-size:17px; padding:14px 18px; width:100%; }
  a { color:var(--acc); }
  .muted { color:var(--muted); }
  .small { font-size:13px; }
  .good { color:var(--good); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  .note { font-size:12px; color:var(--muted); margin-top:8px; }
  .msg { padding:14px; color:var(--muted); text-align:center; }
  .err { color:var(--bad); }
  .tag { display:inline-block; font-size:11px; padding:2px 7px; border-radius:99px; background:var(--line); color:var(--text); vertical-align:middle; }
  /* il numero che guardi da un metro di distanza, con la carta in mano */
  .big { font-size:34px; font-weight:700; line-height:1.1; }
  .prezzo { display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); }
  .prezzo:last-child { border-bottom:0; }
  .ris { display:flex; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .ris img { width:46px; border-radius:4px; }
  .ris:last-child { border-bottom:0; }
  details summary { cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>Pokémon</h1>
  <nav id="nav"></nav>
</header>
<main id="view"></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const eur = n => n == null || isNaN(n) ? "–" : n.toLocaleString("it-IT", { style:"currency", currency:"EUR" });
const num = s => parseFloat(String(s ?? "").replace(",", "."));     // la virgola italiana
const ddmm = at => { const d = new Date(at); return !at || isNaN(d) ? "" : d.toLocaleDateString("it-IT", { day:"2-digit", month:"2-digit" }); };
const oggi = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
async function api(url, opt) {
  const r = await fetch(url, opt);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
const LANG_NAME = { it:"Italiano", en:"Inglese", de:"Tedesco", fr:"Francese", es:"Spagnolo", pt:"Portoghese", jp:"Giapponese", "zh-CN":"Cinese", kr:"Coreano" };
const LANG_FLAG = { it:"🇮🇹", en:"🇬🇧", de:"🇩🇪", fr:"🇫🇷", es:"🇪🇸", pt:"🇵🇹", jp:"🇯🇵", kr:"🇰🇷" };
const COND_ORD = ["Near Mint", "Slightly Played", "Moderately Played", "Played", "Poor"];
const COND_IT = { "Near Mint":"Near Mint", "Slightly Played":"Poco giocata", "Moderately Played":"Giocata", "Played":"Molto giocata", "Poor":"Rovinata" };

// ---------- la giornata: quello che hai visto e quello che hai preso ----------
// Resta nel telefono (localStorage): non tocca i file del PC e sopravvive se chiudi la pagina.
const carica = (k, def) => { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } };
let memoriaRotta = false;
const salva = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { memoriaRotta = true; } };
// si tengono 30 giorni: la lista serve in giornata, non come archivio
let acquisti = carica("acquisti", []).filter(a => (Date.now() - Date.parse(a.at || 0)) < 30 * 86400000);
let viste = carica("viste", []);
const diOggi = a => a.filter(x => x.giorno === oggi());
const spesoOggi = () => diOggi(acquisti).reduce((s, x) => s + (x.prezzo || 0), 0);

let tab = "carta";
const TABS = { carta: "Carta", giornata: "Giornata" };
function render() {
  $("#nav").innerHTML = Object.entries(TABS).map(([k, v]) =>
    `<button class="${k === tab ? "on" : ""}" onclick="vai('${k}')">${v}${k === "giornata" && diOggi(acquisti).length ? ` (${diOggi(acquisti).length})` : ""}</button>`).join("");
  ({ carta: viewCarta, giornata: viewGiornata })[tab]();
}
function vai(t) { tab = t; render(); }

// ---------- CARTA: cerchi o fotografi, e vedi i prezzi ----------
let q = "", risultati = null, scelta = null, offerte = null, errore = "", attesa = false, timer = null;
let nRicerca = 0, nApertura = 0;               // contatori: vince sempre l'ultima richiesta partita

async function cerca(testo) {
  q = testo;
  clearTimeout(timer);
  if (testo.trim().length < 3) { risultati = null; return disegnaRisultati(); }
  const mio = ++nRicerca;
  timer = setTimeout(async () => {
    try {
      const r = await api("/api/find?q=" + encodeURIComponent(testo));
      if (mio !== nRicerca) return;            // hai continuato a scrivere: questa risposta è vecchia
      risultati = r; errore = "";
    } catch (e) { if (mio === nRicerca) errore = e.message; }
    if (tab === "carta" && mio === nRicerca) disegnaRisultati();
  }, 250);
}
async function apri(id) {
  scelta = risultati?.cards.find(c => c.id === id) || scelta;
  offerte = null; errore = ""; attesa = true;
  const mio = ++nApertura;
  viewCarta();
  try {
    const o = await api("/api/offers?bp=" + id);
    if (mio !== nApertura) return;             // nel frattempo hai aperto un'altra carta
    offerte = o;
  } catch (e) { if (mio === nApertura) errore = e.message; }
  if (mio !== nApertura) return;
  attesa = false;
  if (scelta) {
    viste = [{ id: scelta.id, nome: scelta.name, exp: scelta.exp, version: scelta.version, giorno: oggi(),
      da: offerte?.offerte?.[0]?.da ?? null, cm: scelta.prezzi?.trend ?? null },
      ...viste.filter(v => v.id !== scelta.id)].slice(0, 80);
    salva("viste", viste);
  }
  if (tab === "carta") viewCarta();
}
function indietro() { scelta = null; offerte = null; errore = ""; viewCarta(); }

// il prezzo che conta: la più economica Near Mint, nella lingua che hai in mano
let linguaScelta = "it", reverseScelto = false;
const miglior = (lang, rev) => (offerte?.offerte || [])
  .filter(o => o.lang === lang && o.reverse === rev && o.cond === "Near Mint")
  .sort((a, b) => a.da - b.da)[0] || null;

// Il prezzo grande è quello della carta che hai in mano: lingua e reverse li scegli tu con
// due tocchi. Le altre combinazioni restano sotto, per confronto.
function scegli(lang, rev) { linguaScelta = lang; reverseScelto = rev; viewCarta(); }
function prezziPrincipali() {
  const nm = miglior(linguaScelta, reverseScelto);
  const altre = [];
  for (const lang of ["it", "en"]) for (const rev of [false, true]) {
    if (lang === linguaScelta && rev === reverseScelto) continue;
    const o = miglior(lang, rev);
    if (o) altre.push({ eti: `${LANG_FLAG[lang]} ${LANG_NAME[lang]}${rev ? " reverse" : ""} Near Mint`, val: o.da, n: o.n });
  }
  return { nm, altre };
}

function offerteHtml() {
  if (attesa) return '<div class="msg">Chiedo a CardTrader…</div>';
  if (errore) return `<div class="msg err">${esc(errore)}</div>`;
  if (!offerte?.offerte?.length) return '<div class="msg">Nessuno la vende in questo momento su CardTrader.</div>';
  const ordine = c => { const i = COND_ORD.indexOf(c); return i < 0 ? 99 : i; };
  const gruppi = [];
  for (const lang of [...new Set([...["it", "en", "de", "fr", "es", "pt"], ...offerte.offerte.map(o => o.lang)])]) {
    for (const rev of [false, true]) {
      const g = offerte.offerte.filter(o => o.lang === lang && o.reverse === rev).sort((a, b) => ordine(a.cond) - ordine(b.cond));
      if (g.length) gruppi.push({ lang, rev, g });
    }
  }
  const blocco = ({ lang, rev, g }) => `<div style="margin-bottom:10px">
      <div><b>${LANG_FLAG[lang] || ""} ${esc(LANG_NAME[lang] || lang)}</b>${rev ? ' <span class="tag">reverse</span>' : ""}</div>
      ${g.map(o => `<div class="prezzo"><span>${esc(COND_IT[o.cond] || o.cond)}</span>
        <span><b>${eur(o.da)}</b> <span class="small muted">${o.n}</span></span></div>`).join("")}</div>`;
  let primi = gruppi.filter(x => x.lang === "it" || x.lang === "en");
  let altri = gruppi.filter(x => x.lang !== "it" && x.lang !== "en");
  if (!primi.length) { primi = altri; altri = []; }     // carte giapponesi: si mostra quello che c'è
  return primi.map(blocco).join("") +
    (altri.length ? `<details><summary class="small muted">altre lingue (${altri.length})</summary>${altri.map(blocco).join("")}</details>` : "");
}

// registra l'acquisto: un tocco, il prezzo, e il totale della giornata si aggiorna
function presa() {
  if (!scelta) return;
  const p = num(prompt(`Quanto l'hai pagata? (€)\n${scelta.name}`, ""));
  if (!(p >= 0) || !isFinite(p)) return;                  // solo una cifra scritta da te
  const nm = miglior(linguaScelta, reverseScelto);
  acquisti = [{ id: scelta.id, nome: scelta.name, exp: scelta.exp, version: scelta.version, prezzo: p,
    lang: linguaScelta, reverse: reverseScelto, giorno: oggi(), at: new Date().toISOString(),
    ct: nm?.da ?? null, cm: scelta.prezzi?.trend ?? null }, ...acquisti];
  salva("acquisti", acquisti);
  vai("giornata");
}

function viewCarta() {
  if (scelta) {
    const c = scelta, p = c.prezzi || {}, { nm, altre } = prezziPrincipali();
    $("#view").innerHTML = `
      <div class="panel">
        <button class="b" onclick="indietro()">← altra carta</button>
        <div style="display:flex;gap:14px;margin-top:10px">
          ${c.img ? `<img src="${esc(c.img)}" alt="" style="width:120px;border-radius:8px">` : ""}
          <div style="flex:1;min-width:0">
            <div style="font-size:18px"><b>${esc(c.name)}</b></div>
            <div class="muted small">${esc(c.exp || "")}${c.version ? " · " + esc(c.version) : ""}</div>
            <div class="note">Controlla che sia questa: stessa espansione, stesso numero.</div>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="row" style="gap:6px;margin-bottom:10px">
          ${["it", "en"].map(l => `<button class="b ${linguaScelta === l ? "p" : ""}" onclick="scegli('${l}', ${reverseScelto})">${LANG_FLAG[l]} ${LANG_NAME[l]}</button>`).join("")}
          <button class="b ${reverseScelto ? "p" : ""}" onclick="scegli('${linguaScelta}', ${!reverseScelto})">reverse</button>
        </div>
        ${nm ? `<div class="big">${eur(nm.da)}</div>
          <div class="muted">${LANG_FLAG[linguaScelta]} ${esc(LANG_NAME[linguaScelta])}${reverseScelto ? " reverse" : ""} Near Mint · la più economica in vendita ora (${nm.n} offerte)</div>
          ${altre.map(r => `<div class="prezzo"><span>${esc(r.eti)}</span><b>${eur(r.val)}</b></div>`).join("")}`
          : `<div class="msg">${attesa ? "Chiedo a CardTrader…" : "Nessuna Near Mint così in vendita ora: guarda sotto le altre condizioni."}</div>`}
        <button class="b p big" style="margin-top:12px" onclick="presa()">L'ho presa: segna il prezzo</button>
      </div>
      <div class="panel">
        <b>Tutte le offerte su CardTrader</b>
        <div class="note" style="margin-top:2px">Prezzi richiesti adesso. CardTrader mostra le 25 più economiche: se mancano le Near Mint, sotto ci sono solo copie giocate.</div>
        <div style="margin-top:10px">${offerteHtml()}</div>
        <a class="b" href="${esc(offerte?.url || ("https://www.cardtrader.com/cards/" + c.id))}" target="_blank" rel="noopener" style="display:inline-block;margin-top:8px">Apri su CardTrader</a>
      </div>
      <div class="panel">
        <b>Cardmarket</b> <span class="small muted">listino del ${esc(ddmm(risultati?.listino))}</span>
        ${c.cm == null ? '<div class="msg">Cardmarket non prezza questa carta (spesso le giapponesi).</div>' : `
          <div class="prezzo"><span>Trend</span><b>${eur(p.trend)}</b></div>
          <div class="prezzo"><span>Media 30 giorni</span><b>${eur(p.avg30)}</b></div>
          ${p.trendHolo ? `<div class="prezzo"><span>Trend reverse</span><b>${eur(p.trendHolo)}</b></div>` : ""}
          ${p.avg30Holo ? `<div class="prezzo"><span>Media 30 g. reverse</span><b>${eur(p.avg30Holo)}</b></div>` : ""}`}
      </div>`;
    return;
  }
  $("#view").innerHTML = `
    <div class="panel">
      <input id="q" placeholder="Nome della carta, o nome e numero" value="${esc(q)}"
        style="width:100%;font-size:17px" oninput="cerca(this.value)" autocomplete="off" enterkeyhint="search">
      <div class="row" style="margin-top:10px">
        <label class="b" style="cursor:pointer">📷 Foto della carta
          <input type="file" accept="image/*" id="foto" style="display:none" onchange="scanFile(this.files[0]); this.value=''"></label>
        <span id="pscanmsg" class="small muted"></span>
      </div>
      <div class="note">Scrivi tre lettere del nome: «charizard 199», «umbreon vmax», «pikachu 58/102». La foto è più lenta e sbaglia più spesso.</div>
    </div>
    <div class="panel" id="lista">${listaHtml()}</div>
    ${memoriaRotta ? '<div class="panel err small">Questo telefono non sta salvando la lista: se chiudi la pagina perdi gli acquisti segnati.</div>' : ""}
    ${diOggi(acquisti).length ? `<div class="panel"><b>Oggi hai speso ${eur(spesoOggi())}</b> <span class="small muted">su ${diOggi(acquisti).length} carte</span></div>` : ""}`;
  const i = $("#q");
  if (i && q) { i.focus(); i.setSelectionRange(q.length, q.length); }
}
function listaHtml() {
  if (errore) return `<div class="msg err">${esc(errore)}</div>`;
  if (!risultati) return '<div class="msg">Cerca una carta, o scattale una foto.</div>';
  if (!risultati.cards.length) return '<div class="msg">Nessuna carta con questo nome.</div>';
  return risultati.cards.map(c => `<div class="ris" onclick="apri(${c.id})">
      ${c.img ? `<img src="${esc(c.img)}" alt="">` : ""}
      <div style="flex:1;min-width:0"><b>${esc(c.name)}</b><div class="small muted">${esc(c.exp || "")}${c.version ? " · " + esc(c.version) : ""}</div></div>
      <div style="text-align:right">${c.prezzi?.trend ? `<b>${eur(c.prezzi.trend)}</b><div class="small muted">Cardmarket</div>` : '<span class="small muted">senza prezzo</span>'}</div>
    </div>`).join("") +
    (risultati.totale > risultati.cards.length ? `<div class="note">Trovate ${risultati.totale}: aggiungi il numero per restringere.</div>` : "");
}
function disegnaRisultati() { if ($("#lista")) $("#lista").innerHTML = listaHtml(); else viewCarta(); }

// ---------- GIORNATA: lo scatolone, quello che hai preso, quanto hai speso ----------
let lotto = carica("lotto", { carte: "", prezzo: "" });
function lottoCalc(k, v) { lotto[k] = v; salva("lotto", lotto); disegnaLotto(); }
function lottoHtml() {
  const n = num(lotto.carte), p = num(lotto.prezzo);
  if (!(n > 0) || !(p >= 0)) return '<div class="note">Scrivi quante carte ci sono e quanto vuole: ti dico quanto costa ogni carta.</div>';
  const each = p / n;
  const [cls, testo] = each <= 0.08 ? ["good", "Prezzo da sfuse: rischi poco anche se dentro non c'è niente."]
    : each <= 0.30 ? ["warn", "Stai pagando la speranza: conviene solo se hai visto qualcosa di buono."]
    : ["bad", "Caro per uno scatolone: prendilo solo se sai già cosa c'è dentro."];
  return `<div class="big ${cls}">${eur(each)}</div><div class="muted">a carta</div><div class="small ${cls}" style="margin-top:6px">${testo}</div>`;
}
function disegnaLotto() { if ($("#lottoout")) $("#lottoout").innerHTML = lottoHtml(); }

function annulla(i) {
  if (!confirm(`Tolgo ${acquisti[i].nome} dagli acquisti di oggi?`)) return;
  acquisti.splice(i, 1); salva("acquisti", acquisti); render();
}
function svuotaViste() { viste = []; salva("viste", viste); render(); }
function copiaGiornata() {
  const righe = diOggi(acquisti).map(a => `${a.nome}${a.exp ? " (" + a.exp + ")" : ""} — pagata ${eur(a.prezzo)}${a.ct ? ", in vendita da " + eur(a.ct) : ""}`);
  const testo = `Carte prese il ${new Date().toLocaleDateString("it-IT")}\n` + righe.join("\n") + `\nTotale speso ${eur(spesoOggi())}`;
  navigator.clipboard?.writeText(testo).then(() => alert("Copiato: puoi incollarlo dove vuoi."), () => alert(testo));
}

// da una carta guardata si torna ai suoi prezzi senza riscrivere il nome
async function riapri(id) {
  const v = viste.find(x => x.id === id);
  if (!v) return;
  scelta = { id: v.id, name: v.nome, exp: v.exp, version: v.version, img: null, cm: null, prezzi: null };
  tab = "carta";
  await apri(id);
  render();
}

function viewGiornata() {
  const oggiAcq = diOggi(acquisti);
  $("#view").innerHTML = `
    <div class="panel">
      <b>Scatolone o lotto</b>
      <div class="row" style="margin-top:8px">
        <label class="small muted">quante carte<br><input type="number" inputmode="numeric" value="${esc(lotto.carte)}" style="width:110px" oninput="lottoCalc('carte', this.value)"></label>
        <label class="small muted">quanto vuole €<br><input type="number" inputmode="decimal" value="${esc(lotto.prezzo)}" style="width:110px" oninput="lottoCalc('prezzo', this.value)"></label>
      </div>
      <div id="lottoout" style="margin-top:10px">${lottoHtml()}</div>
    </div>
    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <b>Prese oggi (${oggiAcq.length})</b><span class="big">${eur(spesoOggi())}</span>
      </div>
      ${oggiAcq.length ? oggiAcq.map(a => {
        const i = acquisti.indexOf(a);
        return `<div class="prezzo"><span>${esc(a.nome)}<div class="small muted">${esc(a.exp || "")}${a.ct ? " · in vendita da " + eur(a.ct) : ""}</div></span>
          <span><b>${eur(a.prezzo)}</b> <button class="b" onclick="annulla(${i})">✕</button></span></div>`;
      }).join("") : '<div class="msg">Ancora niente. Quando prendi una carta, premi «L&#39;ho presa».</div>'}
      ${oggiAcq.length ? `<button class="b" style="margin-top:10px" onclick="copiaGiornata()">Copia il riepilogo</button>` : ""}
    </div>
    ${viste.length ? `<div class="panel"><b>Carte guardate (${viste.length})</b>
      ${viste.slice(0, 30).map(v => `<div class="prezzo" style="cursor:pointer" onclick="riapri(${v.id})">
        <span>${esc(v.nome)} <span class="small muted">${esc(v.exp || "")}${v.version ? " · " + esc(v.version) : ""}</span></span>
        <span class="small">${v.da != null ? "da <b>" + eur(v.da) + "</b>" : ""}</span></div>`).join("")}
      <button class="b" style="margin-top:10px" onclick="svuotaViste()">Svuota</button></div>` : ""}`;
}

// ---------- lettore foto (Tesseract nel browser) ----------
// ===== lettore foto: preparazione, ritagli e aiuti OCR =====
// --- Scanner: legge nome e numero da una foto della carta ---
// Non serve riconoscere il disegno: su ogni carta sono stampati il nome (in alto) e il
// numero (in basso, "125/128"). Letti quelli, il perito sa gia' trovare carta e prezzo, e
// tollera gli errori di lettura come tollera quelli di battitura ("Moushold").
let ocrWorker = null;
async function getOcr(msg) {
  if (ocrWorker) return ocrWorker;
  if (!window.Tesseract) {
    msg("Scarico il lettore di testo (solo la prima volta, circa 10 MB)…");
    await new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
      s.onload = res;
      s.onerror = () => rej(new Error("non riesco a scaricare il lettore di testo: serve la connessione a internet"));
      document.head.appendChild(s);
    });
  }
  msg("Preparo il lettore…");
  ocrWorker = await Tesseract.createWorker("eng");
  return ocrWorker;
}

// Ritaglio di una zona della foto (frazioni di larghezza e altezza), portato a 2000 px di
// larghezza e reso in bianco e nero contrastato. Ritagliare stretto conta piu' di tutto:
// il numero e' minuscolo, e ingrandito da solo il lettore lo legge (Feebas: "041/191"),
// mentre dentro una fascia larga si perde.
function crop(img, x0, y0, x1, y1) {
  const W = img.naturalWidth, H = img.naturalHeight;
  const sw = W * (x1 - x0), sh = H * (y1 - y0), k = 2000 / sw;
  const c = document.createElement("canvas");
  c.width = Math.round(sw * k);
  c.height = Math.round(sh * k);
  const g = c.getContext("2d");
  g.filter = "grayscale(1) contrast(1.8)";
  g.drawImage(img, W * x0, H * y0, sw, sh, 0, 0, c.width, c.height);
  return c;
}
// L'OCR scambia spesso la barra del numero per l, I o |: "125l128" -> "125/128"
const fixSlash = s => s.replace(/(\d{1,3})\s*[|lI\\]\s*(\d{2,3})\b/g, "$1/$2");
// numero con barra ("125/128") oppure codice promo ("DP28", "SWSH050")
const hasNumber = s => /\d{1,3}\s*\/\s*\d{2,3}/.test(s) || /\b(DP|HGSS|BW|XY|SM|SWSH|SVP)\s*\d{1,3}\b/i.test(s);
// il logo stilizzato "ex" viene letto come "@X", "€X" o "©X"
const fixEx = s => s.replace(/[@€©]\s*x\b/gi, " ex");
const cleanOcr = s => s.split("\n").map(l => l.trim()).filter(l => l.length > 1).join("\n");

async function scanFile(file) {
  if (!file) return;
  return scanImage(URL.createObjectURL(file));
}
// Parole della riga "debolezza / resistenza / ritirata", stampata poco sopra il numero su
// quasi tutte le carte Pokemon di ogni epoca. Trovarle dice dove sta la carta nella foto,
// anche quando occupa solo una parte dell'inquadratura (foto "da scambio" col foglietto).
const ANCHOR = /^(weakness|resistance|retreat|debolezza|resistenza|ritirata|faiblesse|resistance|retraite|schwache|resistenz|ruckzug|debilidad|resistencia|retirada)/;
const anchorWord = t => ANCHOR.test(t.toLowerCase().normalize("NFD").replace(/[^a-z]/g, ""));

// Ritaglio in pixel, ingrandito del fattore k, eventualmente a colori invertiti: sulle full art
// il numero e' chiaro su bordo nero, e il lettore vuole testo scuro su fondo chiaro.
function cropPx(img, x0, y0, x1, y1, k, invert) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round((x1 - x0) * k));
  c.height = Math.max(1, Math.round((y1 - y0) * k));
  const g = c.getContext("2d");
  g.filter = `grayscale(1) contrast(1.6)${invert ? " invert(1)" : ""}`;
  g.drawImage(img, x0, y0, x1 - x0, y1 - y0, 0, 0, c.width, c.height);
  return c;
}

// ===== lettore foto: scanImage =====
async function scanImage(src) {
  const msg = t => { const el = $("#pscanmsg"); if (el) el.textContent = t; };
  try {
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.crossOrigin = "anonymous";
      i.onload = () => res(i);
      i.onerror = () => rej(new Error("immagine non leggibile"));
      i.src = src;
    });
    const w = await getOcr(msg);
    const W = img.naturalWidth, H = img.naturalHeight;
    const ocr = async (psm, canvas, blocks) => {
      await w.setParameters({ tessedit_pageseg_mode: String(psm) });
      return (await w.recognize(canvas, {}, blocks ? { blocks: true, text: true } : undefined)).data;
    };
    // psm 11 = testo sparso (il numero e' in mezzo ad altre scritte); psm 7 = una riga sola (il nome)
    const read = async (psm, ...box) => (await ocr(psm, crop(img, ...box))).text;

    // 1) tutta la foto (al massimo 3000 px): testo della carta, nome e parole-guida
    msg("Cerco la carta nella foto…");
    const s = Math.min(1, 3000 / Math.max(W, H));
    const whole = await ocr(11, cropPx(img, 0, 0, W, H, s), true);
    const words = [];
    for (const b of whole.blocks || []) for (const p of b.paragraphs || []) for (const l of p.lines || []) for (const x of l.words || []) words.push(x);
    const anchors = words.filter(x => anchorWord(x.text)).map(x => ({ x0: x.bbox.x0 / s, y0: x.bbox.y0 / s, x1: x.bbox.x1 / s, y1: x.bbox.y1 / s }));

    // 2) il numero sta sotto le parole-guida: fascia bassa della carta, a destra o a sinistra
    //    a seconda dell'epoca. Si prova la fascia intera, poi le due meta', poi a colori invertiti.
    let number = "";
    if (anchors.length) {
      msg("Leggo il numero…");
      const h = Math.max(8, anchors.reduce((t, a) => t + a.y1 - a.y0, 0) / anchors.length);
      const y0 = Math.max(0, Math.min(...anchors.map(a => a.y0)) - h), y1 = Math.min(H, Math.max(...anchors.map(a => a.y1)) + 12 * h);
      const x0 = Math.max(0, Math.min(...anchors.map(a => a.x0)) - 40 * h), x1 = Math.min(W, Math.max(...anchors.map(a => a.x1)) + 40 * h);
      const mid = (x0 + x1) / 2, k = Math.min(4, 44 / h);          // testo portato a ~44 px
      // Ci si ferma solo su un numero vero con la barra. Un "41100" (barra letta come 1) si tiene
      // da parte e si continua: dal rumore escono anche falsi "2720", e fermarsi li' impediva
      // di provare i colori invertiti che servono alle full art.
      const maybe = [];
      outer: for (const inv of [false, true])
        for (const [a, b] of [[x0, x1], [mid, x1], [x0, mid]])
          for (const psm of [11, 6]) {
            const t = fixSlash((await ocr(psm, cropPx(img, a, y0, b, y1, k, inv))).text);
            if (hasNumber(t)) { number = t; break outer; }
            if (/\b\d{1,3}[17]\d{2,3}\b/.test(t)) maybe.push(t);
          }
      if (!hasNumber(number)) number = maybe.join("\n");
    }
    // 3) nessuna parola-guida (carta che riempie la foto, o allenatore): ritagli fissi
    if (!hasNumber(number)) {
      msg("Leggo il numero…");
      for (const [psm, ...box] of [[11, 0, 0.90, 0.5, 1], [11, 0.5, 0.88, 1, 1], [3, 0, 0.82, 1, 1]]) {
        const t = fixSlash(await read(psm, ...box));
        if (hasNumber(t)) { number = t; break; }
      }
    }
    msg("Leggo il nome…");
    const name = fixEx(await read(7, 0, 0.02, 0.7, 0.12));         // utile quando la carta riempie la foto
    const fullText = fixEx(fixSlash(whole.text || ""));
    // la barra letta come "1" o "7" ("41100" per 4/100) la ripara il server, che conosce i denominatori veri
    const found = hasNumber(number) || hasNumber(fullText) || /\b\d{1,3}[17]\d{2,3}\b/.test(number);
    // la carta letta si cerca come se l'avessi scritta a mano
    const testo = [cleanOcr(name), cleanOcr(number), cleanOcr(fullText)].filter(Boolean).join("\n");
    await usaLettura(testo, !found, src);
  } catch (e) { msg("Errore: " + e.message); }
}

// dalla foto arriva del testo: il server riconosce la carta, poi si cerca come se l'avessi scritta
async function usaLettura(testo, numeroMancante, src) {
  const msg = t => { const el = $("#pscanmsg"); if (el) el.textContent = t; };
  msg("Riconosco la carta…");
  try {
    const r = await api("/api/appraise", { method: "POST", body: JSON.stringify({ text: testo, scan: true }) });
    const c = r.card;
    if (c?.name && !c.uncertain) {
      msg("");
      q = c.name + (c.number ? " " + c.number : "");
      await cerca(q);
      viewCarta();
      return;
    }
  } catch (e) { /* se il server non riconosce nulla si passa alla ricerca a mano */ }
  // carta non riconosciuta con certezza: meglio farti scegliere tu dalla lista
  // niente carta: si mette nella ricerca quello che si è letto, così basta correggere
  const nome = (testo.split("\n")[0] || "").trim();
  q = nome;
  viewCarta();
  const el = $("#pscanmsg");
  if (el) el.textContent = numeroMancante
    ? "Non ho letto il numero: scrivilo accanto al nome (es. 199/165)."
    : "Non ho riconosciuto la carta: controlla il nome qui sopra.";
  if (nome) await cerca(nome);
}

render();
